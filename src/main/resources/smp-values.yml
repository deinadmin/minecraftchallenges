# Wertliste der SMP-Wirtschaft. Wird beim ersten Start nach plugins/MinecraftChallenges/smp-values.yml
# kopiert und dort gelesen; Änderungen greifen nach einem Neustart.
#
# value   Referenzwert in Coins pro Stück. Kaufpreise liegen bei 85–125 % davon (Händler 70–85 %).
# depth   Markttiefe: macht das Item bei /sell verkaufbar. Nach so vielen verkauften Stück hat sich der
#         Verkaufspreis halbiert. Kleine Tiefe = Kurs reagiert schnell (seltene oder farmbare Items).
# as      Zählt beim Verkauf als anderes Item (z. B. Eisenblock = 9 Eisenbarren); units = wie viele.
# shop    Pool für den Daily Shop: build (unbegrenzt, stackweise), useful, valuable, rare (je 1× pro Spieler
#         und Tag) oder trader (nur bei Wanderhändlern).
# bundle  Stückzahl pro Kauf (Standard: build 64, sonst 1).
# weight  Wie oft das Angebot gezogen wird (Standard 10).
# item / enchant / level   Für verzauberte Bücher: der Schlüssel ist dann ein freier Name.

market:
  # Anteil des Werts, den /sell bei unberührtem Markt zahlt. Technisch auf 0.175 begrenzt, damit der
  # Verkaufspreis immer unter der Hälfte des günstigsten Kaufpreises bleibt.
  sell-ratio: 0.1667
  # Nach so vielen Stunden hat sich ein Kurseinbruch zur Hälfte erholt.
  recovery-half-life-hours: 24
  # "Heute gesucht": so viele Items bringen heute den Bonus …
  wanted-count: 3
  # … mit diesem Faktor (maximal 0.35 / sell-ratio) …
  wanted-bonus: 2.0
  # … für diesen Anteil der Markttiefe pro Spieler und Tag.
  wanted-share: 0.25

