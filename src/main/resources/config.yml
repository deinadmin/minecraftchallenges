lobby:
  configured: false
  world: lobby
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

jump-n-run:
  platform-material: LIGHT_BLUE_CONCRETE
  start-height: 8
  cleanup-radius: 16.0
  triggers: []
  high-scores: {}
  spawn:
    configured: false

challenge:
  world-name: challenge_mob_hunt
  waiting-world-border-radius: 40.0
  seed: 0
  duration-seconds: 300
  crafting-randomizer:
    duration-seconds: 300
  block-randomizer:
    duration-seconds: 0
  sponge-world:
    duration-seconds: 0

smp:
  world-name: smp
  max-players: 50
  difficulty: NORMAL
  spawn-protection-radius: 150
  # Spielerstände werden zusätzlich bei jedem Verlassen, Ausloggen und Herunterfahren gespeichert.
  autosave-seconds: 30
  # Wartezeit für /home und /spawn. Bewegung oder Schaden bricht den Teleport ab.
  home-warmup-seconds: 3
  economy:
    starting-balance: 100
    currency: Coins
  claims:
    # So viele Grundstücke darf ein Spieler besitzen; jedes weitere kostet beim Kauf das Vielfache.
    max-per-player: 3
    extra-claim-multiplier: 2.0
    # Radius ab der Mitte: 20 bedeutet 41×41 Blöcke. Jedes Upgrade vergrößert um upgrade-step.
    start-radius: 20
    upgrade-step: 10
    # Erster Wert: Kaufpreis. Danach der Preis jedes Upgrades; die Liste bestimmt die größte Stufe.
    prices: [150, 400, 1000, 2000, 3500, 5500, 8000]
    # Abstand zum Spawnschutz und Mindestabstand neuer Grundstücke zu fremden, jeweils in Blöcken.
    spawn-buffer: 30
    min-gap: 15
    # Festungen mit Endportal bleiben frei; 0 schaltet die Prüfung ab.
    stronghold-buffer: 112
    # So viel der bezahlten Coins gibt /claim abandon zurück.
    refund-percent: 50
  npcs:
    # Quest-NPCs erscheinen einmal pro passendem Bauwerk (Netherfestung, Bastion, Endstadt, Monument …),
    # sobald dessen Chunks geladen werden. false stoppt nur neue; vorhandene bleiben stehen.
    quest-givers: true
    # Quest-NPCs in Dörfern, Netherfestungen, Bastionen, Endstädten, Außenposten, Anwesen, Prüfungskammern und
    # Antiken Städten laufen im Bauwerk umher, höchstens so viele Blöcke von ihrem Platz entfernt.
    quest-roam-radius: 24
    # Umherlaufende NPCs (Händler, Quest-NPCs) gehen nur, solange ein Spieler höchstens so viele Blöcke entfernt ist;
    # sonst stehen sie still und kosten nichts. 0 = immer laufen.
    wake-distance: 64
    # Nach einer gescheiterten oder abgebrochenen Quest ist nur dieser eine NPC so lange gesperrt.
    quest-retry-hours: 24
    traders:
      max-active: 3
      # Frühestens alle so viele Minuten erscheint ein neuer Händler, und nur wenn jemand im SMP ist.
      spawn-interval-minutes: 30
      # Entfernung vom SMP-Spawn in Blöcken.
      min-distance: 250
      max-distance: 2500
      # Findet sich innerhalb von max-distance gar kein Platz, wird auch weiter draußen bis zu dieser Entfernung gesucht.
      fallback-max-distance: 7500
      # Ein Händler läuft in einem Quadrat von so vielen Blöcken in jede Richtung um seinen Standort.
      # Dort sind Abbauen, Bauen und neue Grundstücke gesperrt, solange er da ist.
      roam-radius: 10
      lifetime-hours-min: 24
      lifetime-hours-max: 48
  backups:
    # relativ zum Serverordner
    folder: backups/smp
    daily-enabled: true
    daily-time: "04:00"
    keep-daily: 14
    keep-manual: 30
    keep-pre-restore: 5

# Gemeinsames Budget für alle Schwammwelten; Spielregeln und Sichtweite bleiben unverändert.
performance:
  sponge:
    max-in-flight-chunks: 4
    blocks-per-tick: 2048
    milliseconds-per-tick: 2.0
